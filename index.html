<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser bar colour: the header's paper. Kept in step with the palette
         and theme by the script below. -->
    <meta name="theme-color" content="#e9eae2" />

    <!-- Per-route title / description / canonical / OG / JSON-LD are rendered
         by unhead (see src/composables/useSeo.js); site-wide card constants
         live in App.vue. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pre-paint background to avoid a flash before the stylesheet loads. */
      html { background: #e3e4db; }
      html[data-palette='warm'] { background: #ece6da; }
      html[data-theme='dark'] { background: #161917; color-scheme: dark; }
      html[data-theme='dark'][data-palette='warm'] { background: #1a1714; }
    </style>
    <script>
      (function () {
        try {
          if (localStorage.getItem('lj-palette') === 'warm') {
            document.documentElement.dataset.palette = 'warm';
          }
          var theme = localStorage.getItem('lj-theme');
          if (theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) {
          /* ignore */
        }

        // --paper for each palette and theme (src/styles/main.css). The footer
        // switches only flip data-* on <html>, so watching those is enough.
        var paper = {
          alpine: { light: '#e9eae2', dark: '#1b1e1c' },
          warm: { light: '#f2ece0', dark: '#1f1b17' }
        };
        var root = document.documentElement;
        function syncThemeColor() {
          var meta = document.querySelector('meta[name="theme-color"]');
          var palette = root.dataset.palette === 'warm' ? 'warm' : 'alpine';
          if (meta) meta.content = paper[palette][root.dataset.theme === 'dark' ? 'dark' : 'light'];
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(root, { attributeFilter: ['data-theme', 'data-palette'] });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
